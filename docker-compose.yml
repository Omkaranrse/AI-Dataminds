services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-datamind}
      POSTGRES_USER: ${POSTGRES_USER:-datamind}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-datamind}
    volumes: [postgres_data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-datamind} -d ${POSTGRES_DB:-datamind}"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports: ["5432:5432"]
  api:
    build: ./backend
    env_file: .env
    depends_on:
      db: { condition: service_healthy }
    ports: ["8000:8000"]
    restart: unless-stopped
  web:
    build:
      context: ./frontend
      args: { NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000/api/v1} }
    env_file: .env
    depends_on: [api]
    ports: ["3000:3000"]
    restart: unless-stopped
volumes:
  postgres_data:

