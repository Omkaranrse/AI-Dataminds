version: '3.8'

services:
  db:
    image: pgvector/pgvector:pg15
    container_name: aether_db
    restart: always
    environment:
      POSTGRES_DB: aether_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: securepassword123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d aether_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: aether_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: aether_backend
    restart: always
    environment:
      - DATABASE_URL=postgresql://postgres:securepassword123@db:5432/aether_db
      - REDIS_URL=redis://redis:6379/0
      - SECRET_KEY=supersecretjwtkey98765432101234567890abcdef
      - OPENAI_API_KEY=$OPENAI_API_KEY
      - ANTHROPIC_API_KEY=$ANTHROPIC_API_KEY
      - ENV=production
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - shared_uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: aether_frontend
    restart: always
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
    depends_on:
      - backend

volumes:
  postgres_data:
  redis_data:
  shared_uploads:
