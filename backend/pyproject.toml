[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "datamind-api"
version = "0.1.0"
description = "DataMind AI API"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.13.2,<2",
  "asyncpg>=0.29.0,<1",
  "email-validator>=2.2.0,<3",
  "fastapi>=0.115.0,<1",
  "httpx>=0.27.0,<1",
  "passlib[argon2]>=1.7.4,<2",
  "pydantic-settings>=2.4.0,<3",
  "python-jose[cryptography]>=3.3.0,<4",
  "python-multipart>=0.0.9,<1",
  "sqlalchemy[asyncio]>=2.0.32,<3",
  "uvicorn[standard]>=0.30.5,<1",
]

[project.optional-dependencies]
dev = [
  "aiosqlite>=0.20.0,<1",
  "pytest>=8.3.2,<9",
  "pytest-asyncio>=0.23.8,<1",
  "pytest-cov>=5.0.0,<6",
  "ruff>=0.6.2,<1",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.setuptools.packages.find]
include = ["app*"]
exclude = ["migrations*", "tests*"]
